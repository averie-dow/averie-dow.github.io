<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Garden</title>
    <style>
        .card-header{
            display:flex;
            flex-direction:column;
            gap:0rem; 
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        h3{
            text-align: center;
            font-size: 3rem;
        }
        .expand-btn{
            height:10rem;
            width:10rem;
            border-radius: 50%;
            border: 2px black solid;
            
        }
        .minimize-btn{
            display:none;
            height:10rem;
            width:10rem;
            border-radius: 50%;
            border: 2px black solid;
        }
        button:hover{
            background-color: orange;
            
        }

        .card-content{
            display:none; 
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap:0rem;
        }

    
        
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h3>Community Garden Project</h3>
            <button class="expand-btn" aria-label="Expand/Minimize button">+</button>
  </div>
    <div class="card-content">
     <p class="summary">Join neighbors in creating a shared growing space...</p>
        <div class="details hidden">
        <p>Meeting every Saturday at 10am. Tools provided. All skill levels welcome.</p>
        <p>Contact: garden@community.org</p>
    </div>
  </div>
</div>
<script>
    let info = false;

    const expandBtn = document.querySelector('.expand-btn');
    const details = document.querySelector('.card-content');

    expandBtn.addEventListener('click', showInfo);
    minBtn.addEventListener('click', closeInfo);

    function showInfo(){

        if(info== false){
            details.style.display = "flex";
            expandBtn.textContent="-";
            // SOURCE for textContent: https://www.w3schools.com/jsref/prop_node_textcontent.asp
            info=true;
        }
        else{
            details.style.display = "none";
            expandBtn.textContent="+";
            info=false;
            
        }}


    
    

</script>

</body>
</html>
