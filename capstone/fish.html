<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Origami Fish Text Box</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    overflow:hidden;
    font-family:sans-serif;
}

/* Text box container */

.box{
    position:relative;
    width:260px;
    height:120px;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:all 1s ease;
}

/* input */

input{
    border:none;
    outline:none;
    background:transparent;
    font-size:18px;
    width:90%;
    text-align:center;
}

/* origami fish */

.fish{
    position:absolute;
    width:80px;
    height:60px;
    transform-origin:center;
}

/* body */

.body{
    width:0;
    height:0;
    border-left:40px solid #ffd84d;
    border-top:30px solid transparent;
    border-bottom:30px solid transparent;
}

/* tail */

.tail{
    position:absolute;
    left:-30px;
    top:10px;
    width:0;
    height:0;
    border-right:30px solid #ffc107;
    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    animation:tailFlap .6s infinite alternate;
}

/* eye */

.eye{
    position:absolute;
    width:8px;
    height:8px;
    background:#333;
    border-radius:50%;
    top:26px;
    left:18px;
}

/* folding animation */

.fold{
    animation:fold 1s forwards;
}

/* swimming */

.swim{
    animation:swim 6s linear forwards;
}

/* animations */

@keyframes fold{
    0%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
    40%{
        transform:scale(.6) rotate(15deg);
    }
    100%{
        transform:scale(.3) rotate(0);
        opacity:0;
    }
}

@keyframes swim{
    0%{ transform:translateX(0) translateY(0);}
    25%{ transform:translateX(150px) translateY(-30px);}
    50%{ transform:translateX(300px) translateY(10px);}
    75%{ transform:translateX(450px) translateY(-20px);}
    100%{ transform:translateX(650px) translateY(0);}
}

@keyframes tailFlap{
    from{ transform:rotate(-15deg);}
    to{ transform:rotate(15deg);}
}

</style>
</head>

<body>

<div class="box" id="box">
<input id="textInput" placeholder="Type something and press Enter">
</div>

<script>

const input = document.getElementById("textInput");
const box = document.getElementById("box");

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && input.value.trim() !== ""){

/* fold text box */

box.classList.add("fold");

/* create fish */

setTimeout(()=>{

box.style.display="none";

const fish = document.createElement("div");
fish.className="fish swim";

fish.innerHTML=`
<div class="tail"></div>
<div class="body"></div>
<div class="eye"></div>
`;

document.body.appendChild(fish);

},800);

}

});

</script>

</body>
</html>
