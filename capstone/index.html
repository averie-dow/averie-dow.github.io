<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Hero Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sticky Hero Section -->


      
      <!-- ======================================================= -->
      <!-- PUT YOUR IMAGE HERE                                     -->
      <!-- The 'src' attribute must perfectly match the file name  -->
      <!-- ======================================================= -->
      
      <img src="/AVERIEDOW.svg" alt="Paper Theater Stage" class="theater-image">
      
      <!-- ======================================================= -->



  <!-- Main Content below the fold -->
  <main class="main-content">
    <h2>Main Content Starts Here</h2>
    <p>This content scrolls up over or past the sticky hero background.</p>
  </main>

</body>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  color: #333;
  /* A dark background behind everything can look nice for a theater theme */
  background-color: #1a1a1a; 
}

/* 
  1. Container handles the scroll duration.
     200vh means it takes 1 full screen height of scrolling to get past it.
*/
.hero-container {
  height: 200vh; 
  position: relative;
}

/* 
  2. Hero acts as the sticky viewport frame.
*/
.hero {
  position: sticky;
  top: 0;
  width: 100%;
  height: 100vh;
  
  /* Centers the theater image perfectly */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1;
}

/* 
  3. The specific styling to shrink the paper theater image.
*/
.theater-image {
  /* Restricts the size so it doesn't touch the edges */
  max-width: 80%;
  max-height: 80vh;
  
  /* Ensures the aspect ratio remains perfectly intact */
  object-fit: contain; 
  
  /* Adds a slight shadow to make it feel like a physical paper object */
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
}

/* 
  4. The main content that slides up.
*/
.main-content {
  position: relative;
  z-index: 2;
  background-color: #ffffff;
  padding: 4rem 2rem;
  min-height: 100vh;
  text-align: center;
}

.main-content h2 {
  font-size: 2.5rem;
  margin-bottom: 1rem;
}

</style>
</html>
